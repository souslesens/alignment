<style>
    .browseRightPanel {
        width: 800px;
        height: 600px;
    }
</style>

<div id="Alignment_makeLeftPanel">
    <!-- One target tree: the default targets, plus the sources picked with "choose source",
         which are appended under them and marked "(skos mode)". -->
    <div style="flex:1 1 50%;min-width:0;min-height:0;overflow:hidden;margin-left:10px;display:flex;flex-direction:column;">
        <div style="flex:0 0 auto;display:flex;align-items:center;height:26px;">
            <span style="display:inline-block;width:125px;">Target source</span>
            <button onclick="Alignment.chooseTargetSource()">choose source</button>
        </div>
        <div id="Alignment_targetContainersDiv" style="flex:1 1 auto;min-height:0;overflow:auto;"></div>
    </div>
    <hr>

    <div style="flex:0 0 auto;">
        <button onclick="Alignment.openSource()">choose source</button>
        <input type="checkbox" id="Alignment_allClassesCBX"/>AllClasses
        <button onclick="Alignment.listSimilars()">list similars</button>
    </div>

    <!-- Container trees: source (left half) | UNSPSC (right half) -->
    <div style="display:flex;flex-direction:column;flex:0 0 auto;margin-top:6px;">
        <div style="flex:1 1 50%;min-width:0;">
            <div id="Alignment_sourceContainersDiv" class="browseRightPanel"></div>
        </div>


    </div>
</div>
